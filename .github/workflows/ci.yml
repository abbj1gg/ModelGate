name: ModelGate CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      AUTH_ENABLED: "true"
      DEV_API_KEY: "mg_dev_123456_change_me"
      DEMO_MODE: "true"
      LITELLM_API_KEY: "ci-placeholder"
      LITELLM_MODEL: "deepseek/deepseek-chat"
      DATABASE_PATH: "data/modelgate-ci.db"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q